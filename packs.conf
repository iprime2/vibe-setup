# Optional packs for bootstrap.sh --pack NAME[,NAME] (or --pack all).
# Sourced by bash: plain KEY="value" lines only. Without --pack nothing here is installed.
#
# Item kinds:
#   skill:NAME    this repo's skills/NAME/
#   agent:NAME    this repo's agents/NAME.md
#   command:NAME  this repo's commands/NAME.md
#   tob:NAME      Trail of Bits skill, pinned in sources.lock (TOB_SKILL_PATHS)
#   wsh:NAME      wshobson/agents skill, pinned in sources.lock (WSHOBSON_SKILL_PATHS)
#   ecc:NAME      ECC skill, pinned in sources.lock (ECC_SKILL_PATHS)

PACKS="roles quant systems web3 fintech security mobile ops memory pm"

PACK_roles="agent:lead-engineer agent:senior-engineer agent:mid-level-engineer agent:ai-engineer command:tiered-review skill:system-design skill:ai-engineer"
PACK_quant="skill:quant-researcher skill:quant-developer"
PACK_systems="skill:rust-developer skill:cpp-developer skill:low-latency-systems tob:modern-cpp ecc:rust-patterns ecc:rust-testing ecc:cpp-testing"
PACK_web3="skill:blockchain-developer skill:solidity-developer skill:web3-integration skill:crypto-custody-and-keys tob:entry-point-analyzer tob:secure-workflow-guide tob:guidelines-advisor tob:token-integration-analyzer tob:code-maturity-assessor tob:audit-prep-assistant ecc:evm-token-decimals ecc:defi-amm-security"
PACK_fintech="skill:financial-ledger skill:kyc-aml-compliance"
PACK_security="tob:property-based-testing"
PACK_mobile="skill:react-native-expo ecc:react-native-patterns"
PACK_ops="wsh:prometheus-configuration wsh:postmortem-writing"
PACK_memory="skill:agent-memory command:learn command:promote-lessons command:handoff command:pickup"
# pm builds on roles (/gated-review runs its reviewers) and memory (/pickup, /handoff): --pack roles,memory,pm.
# Its four builder agents are the only agents here with write tools (tests/test_packs.sh pins them).
PACK_pm="skill:project-manager skill:github-api agent:junior-dev agent:mid-dev agent:senior-dev agent:lead-dev agent:qa-engineer command:gated-review"
