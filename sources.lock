# Agent Skills: github.com/addyosmani/agent-skills (MIT). Commit of 2026-10-03.
# Pinned, not audited line by line.
AGENT_SKILLS_REPO="addyosmani/agent-skills"
AGENT_SKILLS_SHA="1401c8b8030e023baeebb31781a6653fe8e93026"

# What to copy from agent-skills (skills/<name>, .claude/commands/<name>.md, agents/*.md).
# code-simplification (/code-simplify), browser-testing-with-devtools (/test and the
# web-performance-auditor agent) and performance-optimization are included so those do not dangle.
AGENT_SKILLS_LIST="interview-me spec-driven-development planning-and-task-breakdown incremental-implementation test-driven-development debugging-and-error-recovery code-review-and-quality security-and-hardening frontend-ui-engineering git-workflow-and-versioning shipping-and-launch doubt-driven-development code-simplification browser-testing-with-devtools performance-optimization"
AGENT_COMMANDS="spec plan build test review code-simplify ship"

# The sources below are fetched only when a --pack needs them (see packs.conf).
# Only the skill folders listed are copied, never a whole plugin, and the upstream LICENSE is
# copied into each one. Paths are relative to the repository root at the pinned commit; the last
# part of each path is the skill's name.

# Trail of Bits skills: github.com/trailofbits/skills (CC-BY-SA-4.0). Commit of 2026-10-23.
# Audited line by line: every file in the listed skill folders was read in full on 2026-10-26.
# Not listed, because they need plugin-only features or break a standing rule: rust-review and
# c-review (CLAUDE_PLUGIN_ROOT, plugin scripts), insecure-defaults (a plugin command, not a skill),
# zeroize-audit (Serena MCP server, plugin agents), dimensional-analysis (plugin agents),
# constant-time-analysis (analyzer lives outside the skill folder), supply-chain-risk-auditor
# (reads the gh CLI token). From building-secure-contracts only the general and EVM skills are listed.
TOB_REPO="trailofbits/skills"
