TOB_SKILL_PATHS="plugins/entry-point-analyzer/skills/entry-point-analyzer plugins/modern-cpp/skills/modern-cpp plugins/property-based-testing/skills/property-based-testing plugins/building-secure-contracts/skills/secure-workflow-guide plugins/building-secure-contracts/skills/guidelines-advisor plugins/building-secure-contracts/skills/token-integration-analyzer plugins/building-secure-contracts/skills/code-maturity-assessor plugins/building-secure-contracts/skills/audit-prep-assistant"

